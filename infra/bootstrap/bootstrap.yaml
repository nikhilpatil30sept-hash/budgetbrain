AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  BudgetBrain AWS bootstrap, created once from the CloudFormation console.
  Holds what must outlive a Terraform destroy: the GitHub deploy role
  (GitHub OIDC, no stored AWS keys), the Terraform state bucket, the ECR
  image repository and a monthly cost budget with email alerts.

Parameters:
  GitHubOwner:
    Type: String
    Default: nikhilpatil30sept-hash
    Description: GitHub user or organization that owns the repository.
  GitHubRepo:
    Type: String
    Default: budgetbrain
    Description: Repository allowed to deploy.
  GitHubEnvironment:
    Type: String
    Default: aws
    Description: >-
      Only workflow jobs running in this GitHub environment can assume the
      deploy role. Restrict the environment to the main branch in GitHub.
  BudgetEmail:
    Type: String
    AllowedPattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
    ConstraintDescription: Must be an email address.
    Description: Where AWS Budgets sends cost alerts.
  MonthlyBudgetUSD:
    Type: Number
    Default: 30
    MinValue: 1
    Description: Monthly cost budget in USD. Alerts at 50% and 80% actual, and 100% forecast.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: budgetbrain-github-deploy
      Description: Assumed by GitHub Actions (OIDC) to deploy and destroy BudgetBrain.
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}/${GitHubRepo}:environment:${GitHubEnvironment}
      ManagedPolicyArns:
        # Everything except IAM and account management. IAM access is
        # added below and limited to roles named budgetbrain-*.
        - !Sub arn:${AWS::Partition}:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: manage-budgetbrain-roles-only
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AppRolesOnly
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:ListInstanceProfilesForRole
                  - iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/budgetbrain-*
              - Sid: ServiceLinkedRolesForEcsAndLoadBalancing
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
                Condition:
                  StringEquals:
                    iam:AWSServiceName:
                      - ecs.amazonaws.com
                      - ecs.application-autoscaling.amazonaws.com
                      - elasticloadbalancing.amazonaws.com

  TerraformStateBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Holds only Terraform state, written by one deploy role; versioning keeps every change, so a second access-log bucket adds cost without adding much.
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub budgetbrain-tfstate-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-state-versions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 90

  TerraformStateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TerraformStateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyPlainHttp
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt TerraformStateBucket.Arn
              - !Sub ${TerraformStateBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  AppRepository:
    Type: AWS::ECR::Repository
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_136
            comment: Images are encrypted at rest with AES-256 (EncryptionType below); a customer-managed KMS key would add monthly cost for a public app's image.
    Properties:
      RepositoryName: budgetbrain
      # Tags are git commit SHAs; immutable tags mean a SHA always points at
      # the image that was tested, which is what makes rollback trustworthy.
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      EmptyOnDelete: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the 10 most recent images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": { "type": "expire" }
              }
            ]
          }

  MonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: budgetbrain-monthly
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyBudgetUSD
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 50
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  AwsRegion:
    Description: GitHub variable AWS_REGION
    Value: !Ref AWS::Region
  DeployRoleArn:
    Description: GitHub variable AWS_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  TerraformStateBucketName:
    Description: GitHub variable TF_STATE_BUCKET
    Value: !Ref TerraformStateBucket
  EcrRepositoryUri:
    Description: Where the deploy workflow pushes images
    Value: !GetAtt AppRepository.RepositoryUri
