# Render Blueprint for BudgetBrain — https://render.com/docs/blueprint-spec
#
# Deploys the whole app as one free web service: Express serves both the
# API and the built React client from the same origin (see server/src/app.ts),
# so there's no separate static site and no cross-origin cookies to manage.
#
# Secrets are intentionally left blank here (sync: false) — set them once in
# the Render dashboard after the first deploy, not in this file:
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, GEMINI_API_KEY, RESEND_API_KEY,
#   MAIL_FROM, APP_URL (set this to the https://<service>.onrender.com URL
#   Render assigns on first deploy).
services:
  - type: web
    name: budgetbrain
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: APP_URL
        sync: false
