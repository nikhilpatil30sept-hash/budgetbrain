name: CI

# Runs on every push (any branch) and every pull request, so a broken
# commit is caught before it ever reaches Render.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The committed package-lock.json was generated on macOS and only
      # pins the darwin build of Rollup's optional native binary. Both
      # `npm ci` AND a plain `npm install` respect that pinned resolution
      # and fail on Linux with "Cannot find module
      # @rollup/rollup-linux-x64-gnu" (npm/cli#4828) — confirmed by this
      # workflow's first run. Deleting the lockfile before installing is
      # the same fix already proven on Render: it forces npm to resolve
      # optional deps fresh for the actual platform instead of trusting a
      # lockfile written on a different OS.
      - name: Install dependencies (server + client)
        run: rm -f package-lock.json && npm install

      - name: Lint (ESLint -- server + client)
        run: npm run lint

      # --omit=dev: this gate exists to catch vulnerabilities that actually
      # reach a user (the server's runtime deps, the client bundle a
      # browser downloads/executes). devDependencies never ship -- ESLint,
      # Vitest, and (as of the regression-security work) autocannon, a
      # manually-run local load-test tool, live here too. Plain `npm audit`
      # flags those as if they were equally exposed, which they aren't;
      # `--omit=dev` keeps the gate meaningful instead of failing the build
      # over, say, a load-test script's own dependency chain.
      - name: Audit dependencies (server + client)
        run: npm audit --omit=dev

      - name: Audit dependencies (e2e)
        working-directory: e2e
        run: npm audit

      - name: Build (compile check)
        run: npm run build

      - name: Run unit tests with coverage (Vitest -- server + client)
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            server/coverage/
            client/coverage/
          retention-days: 14

      # Playwright's tests log in as this seeded demo account (see
      # e2e/tests/utils.ts). Must run before the app starts so the account
      # already exists when the login flow hits it.
      - name: Seed demo account for e2e tests
        run: npm run seed

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox webkit

      # playwright.config.ts's webServer block starts `npm run dev` (both
      # server + client) itself and waits for it to be ready.
      - name: Run end-to-end tests (Playwright)
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  # Builds the production Docker image and runs the deployment tests
  # (e2e/cloud, BB-C1 to BB-C9) against the running container, so an image
  # that can't start, serve the client or keep its headers fails here, long
  # before anything reaches AWS. HTTPS-only checks skip themselves on
  # http://localhost and run in the AWS deploy workflow instead.
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the production image
        run: docker build -t budgetbrain:ci .

      - name: Start the container (production mode, local SQLite)
        run: |
          docker run -d --name budgetbrain -p 3001:3001 budgetbrain:ci
          for _ in $(seq 1 45); do
            status=$(docker inspect -f '{{.State.Health.Status}}' budgetbrain)
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "Container health: $status"
          [ "$status" = healthy ]

      - name: The container runs as a non-root user
        run: test "$(docker exec budgetbrain id -u)" != "0"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install e2e dependencies and Chromium
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run deployment tests against the container
        working-directory: e2e
        env:
          CI: true
          BASE_URL: http://localhost:3001
          EXPECT_DATABASE: local-file
          EXPECT_GEMINI_KEY: "false"
        run: npx playwright test -c playwright.cloud.config.ts

      - name: Container logs
        if: failure()
        run: docker logs budgetbrain

      - name: Upload deployment test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-report
          path: e2e/playwright-report-cloud/
          retention-days: 14

  # Static checks on the AWS infrastructure code. Never touches AWS: no
  # credentials, no state backend.
  infra-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "<2.0.0"

      - name: Terraform format
        working-directory: infra/terraform
        run: terraform fmt -check -recursive -diff

      - name: Terraform validate
        working-directory: infra/terraform
        run: |
          terraform init -backend=false -input=false
          terraform validate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install checkov and cfn-lint
        run: pip install checkov cfn-lint

      - name: Lint the bootstrap CloudFormation template
        run: cfn-lint infra/bootstrap/bootstrap.yaml

      # Security misconfiguration scan for both the Terraform and the
      # CloudFormation. Deliberate exceptions are skipped in the code
      # itself, each with its reason next to it.
      - name: Security scan (checkov)
        run: checkov -d infra --compact --quiet --skip-download
