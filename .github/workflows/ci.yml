name: CI

# Runs on every push (any branch) and every pull request, so a broken
# commit is caught before it ever reaches Render.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # The committed package-lock.json was generated on macOS and only
      # pins the darwin build of Rollup's optional native binary. Both
      # `npm ci` AND a plain `npm install` respect that pinned resolution
      # and fail on Linux with "Cannot find module
      # @rollup/rollup-linux-x64-gnu" (npm/cli#4828) — confirmed by this
      # workflow's first run. Deleting the lockfile before installing is
      # the same fix already proven on Render: it forces npm to resolve
      # optional deps fresh for the actual platform instead of trusting a
      # lockfile written on a different OS.
      - name: Install dependencies (server + client)
        run: rm -f package-lock.json && npm install

      - name: Lint (ESLint -- server + client)
        run: npm run lint

      - name: Audit dependencies (server + client)
        run: npm audit

      - name: Audit dependencies (e2e)
        working-directory: e2e
        run: npm audit

      - name: Build (compile check)
        run: npm run build

      - name: Run unit tests with coverage (Vitest -- server + client)
        run: npm run test:coverage

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            server/coverage/
            client/coverage/
          retention-days: 14

      # Playwright's tests log in as this seeded demo account (see
      # e2e/tests/utils.ts). Must run before the app starts so the account
      # already exists when the login flow hits it.
      - name: Seed demo account for e2e tests
        run: npm run seed

      - name: Install e2e dependencies
        working-directory: e2e
        run: npm install

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium firefox webkit

      # playwright.config.ts's webServer block starts `npm run dev` (both
      # server + client) itself and waits for it to be ready.
      - name: Run end-to-end tests (Playwright)
        working-directory: e2e
        run: npx playwright test
        env:
          CI: true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
